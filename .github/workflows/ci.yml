name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-version-guard:
    # Merged skill/agent/command changes reach installed users only through
    # `claude plugin update`, which compares versions — a PR that changes
    # plugin content without bumping the version ships to nobody, silently.
    name: Plugin version bumped when plugin content changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require version bump for plugin-content changes
        run: |
          BASE="origin/${{ github.base_ref }}"
          git fetch -q origin "${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD -- skills/ agents/ commands/ hooks/ | wc -l)
          if [ "$CHANGED" -eq 0 ]; then
            echo "No plugin content changed; guard passes."
            exit 0
          fi
          if git diff "$BASE"...HEAD -- .claude-plugin/marketplace.json | grep -q '"version"'; then
            echo "Plugin content changed and marketplace version bumped; guard passes."
            exit 0
          fi
          echo "::error::skills/agents/commands/hooks changed but .claude-plugin/marketplace.json version did not."
          echo "Bump the version in .claude-plugin/marketplace.json (and plugin.json) or installed users never receive this change."
          exit 1

  package-version-guard:
    # Apps that install these tools (Patent Creator Studio among them) decide
    # whether an installed copy is current by comparing the package version.
    # A PR that changes what gets installed without raising the version in
    # pyproject.toml would leave every existing install looking current.
    # Dependabot is exempt: its PRs only raise other libraries' minimum
    # versions, which a same-version reinstall would not pick up anyway; the
    # next real version carries them.
    name: Package version raised when installed code changes
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Require a version bump for installed-code changes
        run: |
          pip install -q packaging
          git fetch -q origin "${{ github.base_ref }}"
          python scripts/check_package_version.py "origin/${{ github.base_ref }}"

  lint-and-test:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Compile-check the package
        run: python -m compileall -q mcp_server skills setup.py

      - name: Run tests
        env:
          PATENT_LOG_LEVEL: WARNING
        run: pytest tests/ -q
